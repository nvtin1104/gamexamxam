services:
  mongodb:
    image: mongo:latest
    container_name: gamexamxam-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: gamexamxam
    volumes:
      - mongodb_data:/data/db
    networks:
      - gamexamxam-network

  backend-server:
    build:
      context: ./backend-server
      dockerfile: Dockerfile.dev
    container_name: gamexamxam-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./backend-server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=300
      - TS_NODE_TRANSPILE_ONLY=1
      - WATCHPACK_POLLING=true
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/gamexamxam?authSource=admin
    depends_on:
      - mongodb
    networks:
      - gamexamxam-network


  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: gamexamxam-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend-server
    networks:
      - gamexamxam-network
      
volumes:
  mongodb_data:

networks:
  gamexamxam-network:
    driver: bridge
